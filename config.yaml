# ============================================================
# LLM Gateway configuration
# ============================================================
# Public model names ("models[].name") are what clients send in the
# `model` field. Each maps to one or more deployments, tried in
# ascending `priority` order (lower = preferred), with `max_retries`
# attempts (configurable per-deployment or globally in `routing`).

providers:
  openai:
    api_base: https://api.parasail.io/v1
    api_key_env: OPENAI_API_KEY
  anthropic:
    api_base: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
  gemini:
    api_base: https://generativelanguage.googleapis.com
    api_key_env: GEMINI_API_KEY
  # Azure OpenAI speaks the OpenAI wire format but addresses *deployments*:
  # a deployment's `model` below is the Azure deployment name, auth uses
  # the api-key header, and every call carries ?api-version= (defaults to a
  # recent stable value; pin it per provider with api_version).
  # azure:
  #   api_base: https://myresource.openai.azure.com
  #   api_key_env: AZURE_OPENAI_API_KEY
  #   api_version: "2024-10-21"

models:
  - name: gpt-4o
    # Advertised context window (total tokens, input + output) — the
    # number the context_window guardrail enforces pre-flight. None =
    # unmanaged. Declare it once here, not in guardrail params.
    context_window: 128000
    deployments:
      # Each deployment may carry a `residency` tag (lowercase slug,
      # e.g. "eu"): the operator's assertion of where it processes
      # data. Keys/tenants with required_residencies (POST/PATCH
      # /admin/keys, /admin/tenants, admin UI) may only be served —
      # and shadow-mirrored — by deployments whose tag is in their
      # effective set; an untagged deployment satisfies NO requirement
      # (fail closed: no claim, no compliance), and a model with no
      # compliant deployment answers 404 residency_not_satisfied.
      # The requirement intersects key and tenant (tenant can only
      # narrow), filters the priority ladder BEFORE retries/fallbacks,
      # and rides the cache policy token so residency classes never
      # share entries. No deployments are tagged here: where YOUR
      # providers actually process data is yours to assert.
      - name: openai/gpt-4o
        provider: openai
        model: gpt-4o
      # Fallback: if OpenAI fails after retries, route to Anthropic
      - name: anthropic/claude-sonnet-4-5
        provider: anthropic
        model: claude-sonnet-4-5
        priority: 200
      # Shadow deployment: never serves clients — instead a mirrored copy
      # of `shadow_fraction` (default all) of successful requests is sent
      # to it in the background, for latency/status/content comparison
      # before promotion (own log rows + gateway_shadow_* metrics; the
      # client never sees an effect). Canary rollouts need no separate
      # flag: raise `weight` gradually within a priority tier instead.
      # - name: azure/gpt-4o-shadow
      #   provider: azure
      #   model: gpt-4o-prod            # Azure deployment name
      #   shadow: true
      #   shadow_fraction: 0.1

  - name: gpt-4o-mini
    deployments:
      - name: openai/gpt-4o-mini
        provider: openai
        model: gpt-4o-mini
        # Native Responses southbound (opt-in): requests that arrived via
        # POST /v1/responses are forwarded to the provider's /responses
        # endpoint in their original shape instead of the chat conversion,
        # so Responses-specific fields the conversion drops survive the
        # round trip. The response is translated back into chat shape —
        # guardrails/cache/budgets/logging are unaffected. If a guardrail
        # or the prompt policy modified the request, the adapter falls
        # back to the chat conversion (modifications are never dropped).
        # Plain chat requests ignore the flag. OpenAI + Azure only.
        # native_responses: true

  - name: claude-sonnet-4-5
    deployments:
      - name: anthropic/claude-sonnet-4-5
        provider: anthropic
        model: claude-sonnet-4-5
      - name: gemini/gemini-2.5-pro
        provider: gemini
        model: gemini-2.5-pro
        priority: 200

  - name: gemini-2.5-flash
    deployments:
      - name: gemini/gemini-2.5-flash
        provider: gemini
        model: gemini-2.5-flash

  - name: glm-53
    deployments:
      - name: openai/parasail-glm-53
        provider: openai
        model: parasail-glm-53
      # Fallback: if OpenAI fails after retries, route to Anthropic
      - name: anthropic/claude-sonnet-4-5
        provider: anthropic
        model: claude-sonnet-4-5
        priority: 200
      # Shadow deployment: never serves clients — instead a mirrored copy
      # of `shadow_fraction` (default all) of successful requests is sent
      # to it in the background, for latency/status/content comparison
      # before promotion (own log rows + gateway_shadow_* metrics; the
      # client never sees an effect). Canary rollouts need no separate
      # flag: raise `weight` gradually within a priority tier instead.
      # - name: azure/gpt-4o-shadow
      #   provider: azure
      #   model: gpt-4o-prod            # Azure deployment name
      #   shadow: true
      #   shadow_fraction: 0.1


  # Embeddings models serve POST /v1/embeddings — and, natively, the Gemini
  # inbound form POST /v1[/beta]/models/{model}:embedContent and
  # :batchEmbedContents (same pipeline: allowlists, rate limits, budgets,
  # caching, retries/failover, logs; the paths carry the embeddings token
  # scope). Declared like chat models; they also show up in GET /v1/models
  # (as on OpenAI). Any OpenAI-compatible api_base works; Gemini is
  # translated to batchEmbedContents. Anthropic has no embeddings API — its
  # deployments return a clear 501 and routing falls through to the next
  # deployment.
  - name: text-embedding-3-small
    deployments:
      - name: openai/text-embedding-3-small
        provider: openai
        model: text-embedding-3-small

  # Image and audio models are declared exactly like chat models and get the
  # same routing/retries/failover/breakers/budgets/rate limits/logs — that
  # covers POST /v1/images/generations, /v1/images/edits (uploaded image(s)
  # + prompt; a mask forwards on OpenAI/Azure, no Gemini equivalent) and
  # /v1/images/variations (DALL·E 2 on OpenAI/Azure) as well as the audio
  # endpoints. Images: OpenAI/Azure pass through, Gemini is translated to
  # generateContent (n images = n calls; size/quality have no equivalent).
  # Audio (transcription/translation/TTS): OpenAI/Azure pass through; other
  # providers 501 and routing falls through.
  #
  # Multimodal chat needs no special declaration either: audio input
  # (input_audio parts) rides in chat messages on every inbound format
  # (native Gemini inlineData audio included; Anthropic deployments refuse
  # it and the routing group falls through), and Gemini image models on the
  # chat surface (gemini-2.5-flash-image etc.) do image-to-image chat —
  # images in via image_url parts, images out as image_url content parts.
  # Audio output works the same way: modalities: ["text", "audio"] +
  # audio: {voice, format} on the OpenAI surface, or responseModalities
  # [TEXT, AUDIO] + speechConfig on the native Gemini surface — replies
  # carry message.audio (transcript + WAV or raw pcm16). Anthropic refuses
  # audio output and the routing group falls through.
  - name: gpt-image-1
    deployments:
      - name: openai/gpt-image-1
        provider: openai
        model: gpt-image-1
  - name: whisper-1
    deployments:
      - name: openai/whisper-1
        provider: openai
        model: whisper-1
  # Gemini TTS: gemini-2.5-*-preview-tts via generateContent (AUDIO
  # modality). OpenAI voice names map to Gemini prebuilt voices (alloy ->
  # Kore, ash -> Puck, ... — the map covers all 11 OpenAI voices; unknown
  # names pass through, so every Gemini prebuilt voice works directly:
  # Zephyr, Puck, Charon, Kore, Fenrir, Leda, Orus, Aoede, Callirrhoe,
  # Autonoe, Enceladus, Iapetus, Umbriel, Algieba, Despina, Erinome,
  # Algenib, Achernar, Achird, Rasalgethi, Gacrux, Sadachbia, Sadaltager,
  # Schedar, Sulafar, Laomedeia, Pomona, Vindemiatrix, Alnilam,
  # Zubenelgenubi); output is raw PCM, served as WAV (response_format: pcm
  # serves it raw); speed has no equivalent.
  # - name: gemini-tts
  #   deployments:
  #     - name: gemini/gemini-2.5-flash-preview-tts
  #       provider: gemini
  #       model: gemini-2.5-flash-preview-tts
  - name: tts-1
    deployments:
      - name: openai/tts-1
        provider: openai
        model: tts-1

# ------------------------------------------------------------
# Gateway-managed prompt policy (applied after model resolution,
# before guardrails and cache lookup — checks and cache identity see
# the final prompt; the log row keeps what the client sent).
#
# system_prompt: prepended to requests that carry NO system message of
#   their own. A per-key system_prompt (admin API/UI) overrides this, and
#   a client-supplied system message always wins over both — the gateway
#   manages the prompt for callers that don't provide one.
# variables: resolve {{placeholders}} in message text and in the managed
#   system prompt. A key's prompt_variables merge over these (key wins).
#   Only known names are replaced — unknown placeholders and literal
#   braces (code snippets, JSON examples) pass through untouched.
# ------------------------------------------------------------
prompts:
  system_prompt: "You are a helpful assistant. Be concise."
  variables:
    company: "Acme"
    tone: "formal"
  # How long a key's resolved system_prompt_ref (named library prompt)
  # is cached in-process. Writes through this process's admin API
  # invalidate immediately; the TTL is the cross-replica backstop.
  library_cache_seconds: 30

# ------------------------------------------------------------
# Guardrails run over every request/response.
# Built-ins: pii_redaction, prompt_injection, keyword_blocklist,
#            output_moderation, response_schema, request_limits,
#            presidio_pii (needs `uv sync --extra guardrails`)
# Custom:    set `class: "pkg.module:ClassName"` to load your own
#            Guardrail subclass.
#
# `mode` (default: enforce):
#   enforce — block/modify verdicts take effect
#   observe — verdicts are logged and counted
#             (gateway_guardrail_observed_total) but requests flow on
#             untouched; for measuring false positives before rollout.
# ------------------------------------------------------------
guardrails:
  - name: pii_redaction
    enabled: true
    params:
      mask_in_response: true
      # Mask PII in *streamed* output as it streams (mid-stream
      # rewriting). Holds back the last stream_reserve_chars of each
      # delta so a match split across provider chunks (an email arriving
      # in pieces) never leaks; held-back text flushes redacted before
      # the stream's finish chunk. Patterns that can grow longer than
      # the reserve would still be split — raise it for those.
      mask_in_stream: false
      stream_reserve_chars: 100

  - name: prompt_injection
    enabled: true
    params:
      threshold: 3            # weighted pattern score needed to block

  - name: keyword_blocklist
    enabled: false
    params:
      blocked_terms: []       # plain substrings, case-insensitive
      blocked_patterns: []    # regexes

  - name: output_moderation
    enabled: true

  - name: response_schema
    enabled: true

  # Coarse per-request limits. on_exceed: redirect sends oversized
  # requests to a cheaper model instead of blocking them
  # (reject-and-redirect); redirect_model must be a configured public
  # model the calling key may use.
  - name: request_limits
    enabled: false
    params:
      max_messages: 100
      max_chars: 200000
      on_exceed: block        # block | redirect
      redirect_model: gpt-4o-mini

  # Context-window management: fits the incoming request to the model's
  # declared window (models[].context_window — set it there, once per
  # model) BEFORE it burns upstream quota, with OpenAI-style
  # context_length_exceeded wording and the actual numbers. Input is
  # estimated at ~4 chars/token (the same heuristic as TPM) including
  # the managed system prompt; the response budget is the caller's
  # max_tokens, else reserve_output_tokens. on_exceed: redirect sends
  # over-window requests to a bigger model instead of blocking
  # (redirect_model must be a configured public model the calling key
  # may use). Models with no declared window and no default_window are
  # unmanaged (pass through); "window:" forces a specific number.
  - name: context_window
    enabled: false
    params:
      reserve_output_tokens: 1024
      # default_window: 128000   # for models that declare none
      on_exceed: block           # block | redirect
      redirect_model: gpt-4o

  # Prompt compression: the remediation counterpart of context_window.
  # Where context_window BLOCKS (or redirects) an over-window request,
  # this one deterministically COMPRESSES it to fit — middle-out
  # folding, no LLM call, no added latency. Order it BEFORE
  # context_window in this list: a request folded under the target
  # then passes the check; one that cannot be saved (a gigantic last
  # message) steps aside untouched and gets context_window's honest
  # error. Target: max_input_tokens when set, else the model's
  # declared window minus reserve_output_tokens (same name and default
  # as context_window, so the pairing fits exactly). Always keeps
  # leading system messages, the first keep_first and the last
  # keep_last non-system messages; drops the middle with a marker note
  # prepended to the first kept message (content-only: roles and
  # content shapes are preserved). If still over, truncates kept
  # non-system messages oldest-first toward min_message_chars — the
  # system block and the LAST message are never trimmed. Savings land
  # in the request log's guardrail_actions (tokens_before/after) and
  # on gateway_prompt_compression_saved_tokens_total{model}.
  - name: prompt_compression
    enabled: false
    params:
      # max_input_tokens: 8000   # explicit budget; empty = window-fit
      reserve_output_tokens: 1024
      keep_first: 2              # messages kept at the top (the task)
      keep_last: 4               # kept at the bottom (the live exchange)
      min_message_chars: 512     # floor for oldest-first truncation

  # Production-grade PII detection via Microsoft Presidio (optional
  # 'guardrails' extra). Replaces the regex heuristics above — disable
  # pii_redaction when enabling this.
  # - name: presidio_pii
  #   enabled: true
  #   mode: enforce           # observe → log-only, no enforcement
  #   params:
  #     # Curated default set; PERSON/LOCATION need the NLP engine
  #     entities: [EMAIL_ADDRESS, PHONE_NUMBER, CREDIT_CARD, IBAN_CODE,
  #                IP_ADDRESS, US_SSN, US_ITIN, US_BANK_NUMBER,
  #                PERSON, LOCATION]
  #     block_entities: [CREDIT_CARD]  # block instead of redact (subset)
  #     mask_in_response: true         # also redact model output
  #     score_threshold: 0.3           # presidio score floor
  #     placeholder: "<{ENTITY}>"       # replacement template
  #     use_nlp: true                   # false → pattern-only, no model load
  #     language: en

cache:
  enabled: true
  ttl_seconds: 300
  max_entries: 256
  # backend: memory (default) | redis — redis shares cache entries across
  # workers/replicas (requires the redis section below)
  backend: memory
  # Per-key overrides live on the key row (admin API/UI, tier 54), not
  # here: a key's cache_enabled: false opts it out of BOTH response
  # caches (exact + semantic, chat and embeddings alike) — lookup AND
  # store; it can only narrow, so enabled: false above stays off for
  # every key regardless. A key's cache_ttl_seconds is its own window,
  # honored two-sided: a hit serves only entries within the caller's
  # window (read-side freshness bound) and entries the key writes live
  # that window (write-side lifetime — a window longer than the global
  # ttl_seconds is possible). NULL on the key row = inherit this block.

# Semantic (approximate-match) cache, on top of the exact cache above:
# after an exact miss, embed the normalized request and serve the best
# same-model cached response with >= threshold cosine similarity.
# Costs one embeddings call per uncached request (billed to the
# gateway's provider key). Off by default. Store is per-process.
#semantic_cache:
#  enabled: true
#  model: text-embedding-3-small   # embeddings model (needs a deployment)
#  threshold: 0.95                 # cosine similarity required for a hit
#  ttl_seconds: 300
#  max_entries: 256

# Shared state for multi-worker / multi-replica deployments. Enable by
# setting rate_limit.backend, cache.backend and/or
# routing.breaker.backend to "redis".
redis:
  url: redis://localhost:6379/0
  url_env: REDIS_URL        # env var that overrides url when set
  prefix: llm-gateway

rate_limit:
  backend: memory           # memory | redis

routing:
  timeout_seconds: 300
  max_retries: 2
  retry_backoff_base: 0.5
  # Cost-aware routing: within a priority tier, prefer the deployment
  # whose upstream model has the cheapest INPUT price (per the pricing
  # table below — the same lookup billing uses). The price ladder is
  # also the failover ladder; weight only breaks ties between equal
  # prices; unpriced models sort last (unknown cost gets no discount).
  # Priority still rules across tiers.
  cost_aware: false
  # Per-deployment circuit breaker: a deployment that fails
  # `failure_threshold` consecutive requests (after retries) is skipped
  # for `cooldown_seconds`, then probed with one request before being
  # readmitted. If every deployment of a model is open, the router tries
  # anyway (availability beats protection). State is per-process by
  # default; backend: redis shares it, so one replica's trip opens the
  # circuit for the whole fleet (fails open if Redis is down).
  breaker:
    enabled: true
    # backend: memory        # memory (default) | redis
    failure_threshold: 3
    cooldown_seconds: 30

logging:
  max_body_chars: 20000
  # Wire capture (request-log rows): which headers to persist, as
  # ALLOWLISTS — allow, never block, so a new credential-bearing header
  # can never leak into stored rows by default (Authorization, x-api-key,
  # x-goog-api-key and api-key are deliberately absent). Entries are
  # lowercase header names; a trailing "*" matches prefixes. Defaults
  # (unset): client side = user-agent, x-request-id and the x-stainless-*
  # SDK telemetry; upstream side = x-request-id, request-id, retry-after,
  # openai-processing-ms/version, x-ratelimit-*, ratelimit-*.
  # The client list is read per request (config reload applies live);
  # the upstream list is bound into the provider HTTP client's capture
  # hooks — restart to change it.
  #client_header_allowlist: ["user-agent", "x-request-id"]
  #upstream_header_allowlist: ["x-request-id", "retry-after", "x-ratelimit-*"]
  # Background queued log writes (opt-in hot-path optimization): instead
  # of awaiting the row INSERT in the response path, request-log writes
  # are handed to a bounded queue drained by a background consumer.
  # Semantics change: a returned response no longer implies its log row
  # is queryable (typically a milliseconds-long gap); a full queue drops
  # rows (counted on gateway_logs_dropped_total) rather than blocking.
  # Shutdown drains everything pending.
  #background_write: true
  #queue_size: 1000

# Prometheus behaviour. per_key (opt-in — key names are unbounded label
# cardinality) adds per-key series: gateway_key_requests_total,
# gateway_key_tokens_total and gateway_key_cost_usd_total. Distinct keys
# beyond per_key_max_series collapse into the __overflow__ label (counted
# on gateway_key_label_overflow_total) instead of growing the series
# forever. Shadow-mirrored calls are excluded.
metrics:
  per_key: false
  #per_key_max_series: 256

# Budget alerting: fire a webhook when a virtual key's cumulative spend
# crosses a threshold of its max_budget_usd. Each level fires once per key
# (state persists in the DB, so it survives restarts and holds across
# workers); raising a key's budget re-arms the levels below the new spend.
# Delivery runs in the background spend task — it never blocks requests —
# and is best-effort (timeout + retry, counted on gateway_alerts_total).
# Without a URL, crossings are only counted as outcome="skipped".
# (Daily/monthly budget windows — daily_budget_usd / monthly_budget_usd —
# are set per key via the admin API and are NOT alert-tracked; alerts
# always compare against the total max_budget_usd.)
#
# The same webhook also carries key-expiry warnings (tier 52): a
# background sweep (hourly) walks active keys with an expires_at and
# fires once per day-level as the deadline approaches — 0 is the page
# that the key just died (its credential stops authenticating at that
# moment). Setting or moving a deadline arms silently (levels already
# crossed never page — the operator just chose the deadline); a key the
# sweep discovers already near its deadline fires honestly. Revoked keys
# and keys with no deadline never warn.
alerts:
  budget_thresholds: [50, 80, 90, 100]   # % of max_budget_usd
  expiry_days: [14, 7, 1, 0]   # days before expires_at; 0 = expired page
  #expiry_interval_seconds: 3600          # expiry sweep cadence (seconds)
  # webhook_url: https://hooks.slack.com/services/T000/B000/XXXX
  # url_env: ALERT_WEBHOOK_URL           # env var that overrides webhook_url
  # timeout_seconds: 5                   # per POST attempt
  # max_attempts: 2                      # attempts per alert (1 retry, 0.5s backoff)

# Audit trail: POST one JSON record per security-relevant admin action
# (virtual key create/update/revoke, circuit-breaker reset) to your SIEM.
# Records identify the actor (key name + how they authenticated) and what
# changed; the raw key of a new virtual key is never included. Delivery is
# a background task — a dead endpoint never slows or fails the admin call —
# counted on gateway_audit_events_total (skipped when no URL is set).
audit:
  enabled: true                          # records only go out when a URL is set
  # webhook_url: https://siem.example.com/collect
  # url_env: AUDIT_WEBHOOK_URL
  # timeout_seconds: 5
  # max_attempts: 2

# BYOK vault: tenants store their OWN provider credentials (encrypted,
# admin API: PUT /admin/tenants/{id}/provider-keys/{provider}) and their
# requests ride their account instead of the platform's configured key —
# chat, embeddings, images and audio, through every retry and fallback.
# The vault is ENABLED by GATEWAY_VAULT_MASTER_KEY (env, never here: it
# encrypts secrets, so it is not itself committed):
#   export GATEWAY_VAULT_MASTER_KEY="$(python -c \
#     'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
# (pip install 'llm-gateway[vault]'). Without it the provider-key
# endpoints answer 400 and nothing else changes. Rotation: the setting
# accepts a comma-separated list — the FIRST key encrypts, all decrypt;
# prepend the new key, restart, re-store entries at leisure, drop the old.
vault:
  # How long a decrypted credential is cached in process memory per
  # (tenant, provider) — the hot path is a dict read, not a DB round
  # trip. Admin writes invalidate the local cache immediately; other
  # replicas of a multi-process fleet see writes within the TTL.
  ttl_seconds: 30

# The authentication chain: which strategies may authenticate a caller,
# in order (first match wins; a step can also reject outright → 401).
# Entries are built-in names (admin_key, virtual_key, jwt) or
# "pkg.module:ClassName" paths to custom Authenticator subclasses.
# The jwt step accepts OAuth/JWT bearer tokens: the token's key_claim
# (default sub) names the virtual key whose policy applies — budgets,
# limits, spend and logs accrue to that key exactly as its raw key would.
# Virtual keys may belong to a tenant (admin-API-managed, like the keys
# themselves): a member additionally passes the tenant's pooled allowlist,
# rate limit and budgets, with no admin bypass at the tenant layer —
# see README "Multi-tenancy".
# Requires PyJWT: pip install 'llm-gateway[auth]'
auth:
  chain: [admin_key, virtual_key]        # the default
  # To also accept tokens:
  # chain: [admin_key, virtual_key, jwt]
  # jwt:
  #   secret: shared-hs256-secret          # or jwks_url for asymmetric keys:
  #   # jwks_url: https://idp.example.com/.well-known/jwks.json
  #   # jwks_cache_seconds: 300            # refreshes early on unknown kid
  #   key_claim: sub                       # claim naming the virtual key
  #   issuer: https://idp.example.com      # enforced when set (exp always is)
  #   audience: llm-gateway
  #   leeway_seconds: 30                   # clock-skew tolerance

# Multipart upload policy (/v1/audio/transcriptions|translations file,
# /v1/images/edits|variations images + mask). The gateway buffers uploads
# to route and retry them, so a size bound protects memory. 25 MB matches
# OpenAI's own limits. Rejected uploads fail with 413. Hot-reloadable.
uploads:
  max_upload_mb: 25

# OpenAI-style Batch API: POST /v1/files (JSONL upload) + POST /v1/batches,
# executed in the background by a worker (wave_size lines of the oldest
# runnable batch per poll_interval_seconds tick — the burst is wave-shaped,
# not a wall of every line at once). Lines run through the full pipeline:
# guardrails, cache, spend accounting, request logs. Rate limits and budget
# ceilings defer a batch (retry_not_before) — a line never fails for those;
# the completion window (24h) bounds retries. Hot-reloadable (worker picks
# up wave_size immediately; poll interval applies from the next sleep).
batch:
  enabled: true
  max_file_bytes: 20971520     # 20 MB — matches OpenAI's batch input cap
  max_requests: 10000          # input lines per batch
  wave_size: 16
  poll_interval_seconds: 2.0

# Synthetic canary probes: a background loop sends a tiny chat request
# (max_tokens) straight to every configured deployment's provider on a
# schedule, so upstream health is measured, not inferred from traffic —
# a dead fallback that never receives traffic otherwise reads as
# "healthy" until the moment it's needed and fails. Probes are direct
# provider calls: no pipeline, no guardrails, no request-log rows, no
# spend accounting, no circuit-breaker accounting — they cannot affect
# (or be mistaken for) client traffic, and cost max_tokens of provider
# quota per deployment per wave. Results surface at GET /admin/canaries;
# POST /admin/canaries/probe (platform admin) runs a wave on demand.
# deployments: optional fnmatch allowlist of deployment names
# ("openai/*"); unset = all deployments, shadows included. Hot-reloadable
# (enabled / interval / timeout / allowlist apply from the next loop
# iteration). Failed probes emit canary.failed events; a deployment
# returning to ok emits canary.recovered. Disabled by default: probes
# spend real provider quota.
canary:
  enabled: false
  interval_seconds: 300
  timeout_seconds: 10
  max_tokens: 1
  prompt: "ping"
  # deployments: ["openai/*"]

# PII/secret scan over stored request bodies: an on-demand audit that
# answers "did secrets or PII land in the request log?" — clients paste
# API keys into prompts, guardrails may be off or only masking the
# upstream copy; the log keeps the original as received, so stored rows
# are where exposure actually shows. GET /admin/pii-scan scans recent
# rows, GET /admin/logs/{id}/pii-scan one row. Detectors mirror the
# pii_redaction guardrail (the same patterns — "masked" and "found"
# never drift) plus jwt / private-key secret shapes; extra_patterns
# adds name -> regex detectors, exclude_kinds drops noisy built-ins
# (e.g. ipv4). Findings are kind + count only — never the matched
# text, so the audit never becomes its own leak.
#
# The teeth (findings are RECORDED, not just reported): the first scan
# — on demand or by the sweep below — persists findings on the row,
# exactly once (a guarded write; pii.found fires once per row ever).
# A flagged row is quarantined: GET /admin/logs/{id} serves its bodies
# MASKED (kind-tagged placeholders, structure preserved) and the
# replay export withholds them (a body-less line with a skip_reason).
# quarantine: false opts out — findings stay visible either way.
# sweep_interval_seconds runs a background pass over rows not yet
# scanned (bounded by sweep_max_rows per pass) — it finds what landed
# without an admin asking; quiet traffic is covered too. purge_days:
# delete a flagged row's stored bodies this many days after its
# findings landed (metadata + findings stay for the audit trail;
# null = keep until general log retention). Flagged rows count on
# gateway_pii_scan_findings_total{kind} and emit pii.found events;
# purged rows on gateway_pii_scan_purged_rows_total.
# Note: stored bodies are truncated at logging.max_body_chars — a
# secret past the boundary is invisible to the scan.
pii_scan:
  enabled: true
  max_rows: 500
  quarantine: true
  sweep_interval_seconds: 3600   # one background pass per hour
  sweep_max_rows: 500
  #purge_days: 30               # delete flagged bodies 30 days after the findings landed
  extra_patterns: {}
  exclude_kinds: []

# Idempotency-Key replay for the chat-family surfaces (OpenAI chat,
# /v1/responses, native Anthropic /v1/messages, native Gemini). A client
# supplies an "Idempotency-Key" header; the *successful* response is
# stored under (caller, key) and replays on retry — no double
# generation, no double billing (replays log as cache hits, zero cost,
# X-Gateway-Cache: IDEMPOTENT). Only successes are stored: errors and
# guardrail blocks re-execute on retry, which is what a transient
# failure needs. Reusing a key with different request parameters is a
# 400 (idempotency_key_reuse). Duplicates racing while the original is
# still in flight wait up to inflight_wait_seconds for it (in-process
# wait; the Redis backend dedups only completed entries
# cross-replica). No header = no behavior change; enabled: false =
# the header is ignored entirely. Same backend selection as the
# response cache, namespaced apart ("idem:") with its own TTL/size.
# Outcomes count on gateway_idempotency_total{outcome=replayed|stored|rejected}.
idempotency:
  enabled: true
  ttl_seconds: 86400        # 24h — Stripe's idempotency window
  max_entries: 10000
  inflight_wait_seconds: 30
  backend: memory           # memory | redis

# Capture-to-replay harness — the safety net for config changes. The
# request log *is* the capture (store_bodies above); GET /admin/logs/
# export writes it as JSONL, and POST /admin/replay re-executes those
# requests through the request-policy phases ONLY (resolution, prompt
# policy, permissions, guardrails, routing selection — no upstream
# calls, no counters, no spend, no log rows) as the recorded caller's
# CURRENT key, then diffs the outcome against what the capture
# recorded. The changed lines are what a candidate config would do to
# real traffic — replay before a hot reload, read the diff, then keep
# or roll back. Guardrail counters are suppressed during replay, so
# the harness can never trip block alerts. max_entries bounds one
# replay call: sample traffic, don't re-execute history.
replay:
  enabled: true
  max_entries: 500

# Candidate trials — the deliberate-replay leg of provider migration.
# Where shadow mirroring is passive evidence (only traffic the model
# actually gets, only candidates wired as shadow deployments), a trial
# replays a CAPTURED window on demand: POST /admin/trials takes one
# public model's successful, body-storing chat rows (since/until,
# newest first, up to limit) and sends each to a named candidate
# deployment with REAL upstream calls — any configured deployment,
# it need not belong to the replayed model. Runs are throttled (waves
# of concurrency parallel calls) and spend-capped (max_cost_usd, a
# between-wave cap: it stops the NEXT wave, never one in flight).
# Execution is mirror-like — no guardrails, counters, budgets, caches,
# events or metrics, and no breaker bookkeeping either: an experiment
# must not trip a serving candidate's circuit. Nobody's spend moves;
# each replayed entry writes a scored shadow log row (tier-35 verdict
# vocabulary) carrying the run's trial_id, excluded from the standing
# /admin/shadow-diff aggregate; /admin/trials/{id}/pairs is the
# drilldown. The three max_* fields are CEILINGS: per-run values in
# the POST are clamped into range, so a caller can never ask for more
# replay volume, parallelism or spend than allowed here.
trials:
  enabled: true
  max_entries: 200        # ceiling for per-run limit (replayed entries)
  max_concurrency: 2     # ceiling for per-run concurrency (calls per wave)
  max_cost_usd: 1.0      # ceiling for per-run candidate spend (USD)

# Migration verdicts — the go/no-go recommendation engine over the
# migration evidence. Tiers 13/35/36 collect the evidence (mirrored
# pairs scored raw-vs-raw, candidate trials replayed on demand); this
# section is the call. GET /admin/migration/verdicts verdicts each
# mirrored candidate — and every trial run carries its own folded
# recommendation — as go / hold / no_go / insufficient_evidence with
# the per-check numbers that drove it. A recommendation, never a
# gate: go = every bar cleared; hold = answers fine, a soft concern
# (marginal similarity, a latency regression) needs a business call;
# no_go = answers diverge or the candidate fails the traffic it is
# given; insufficient_evidence = too thin to judge, collect more.
# All five thresholds are read live off the running config and echoed
# in every verdict response — tighten a bar, reload, and the next
# read re-verdicts; the recommendation is always auditable against
# the bars that produced it. min_pairs gates two volumes at once:
# total pairs (what a shadow-error rate can be measured on) and
# comparable pairs among them (what answer equivalence can be judged
# on) — with one exception: a shadow-error rate over its bar on a
# full volume of pairs is a no_go even when nothing was comparable.
migration:
  min_pairs: 20               # mirrored pairs AND comparable pairs needed
  min_match_rate: 0.95        # (exact + near) / comparable at or above
  max_shadow_error_rate: 0.02 # failed mirror calls / pairs at or below
  min_similarity_mean: 0.90   # mean similarity over comparable pairs
  max_latency_delta_pct: 25.0 # candidate mean latency vs primary, %

# Runaway-agent protection: identical-request loop detection with an
# escalating cooldown jail. An agent stuck in a loop (retry storm,
# regenerating tool-call loop) sends the SAME request over and over at
# a rate no legitimate caller produces — every request individually
# legal, so RPM/TPM cannot see it. What identifies the runaway is the
# fingerprint (the same normalized identity the response cache keys on)
# repeated `identical_request_threshold` times inside the window. On
# trip the KEY is jailed: every request from it answers 429
# (rate_limit_exceeded + Retry-After) until the cooldown expires —
# including would-be cache hits and idempotent replays; a still-looping
# agent re-trips on fresh hits after the cooldown, escalating each
# time (multiplier per offense, capped); a quiet reset_after_seconds
# decays the offense count. Detection state is in-process (like the
# idempotency in-flight map): a multi-replica fleet detects at
# per-replica rate — bounded, just slower to trip. Chat-family
# surfaces only (embeddings/images/audio are single-shot, not loops).
# Admin: GET /admin/runaway (jail snapshot + config echo),
# POST /admin/runaway/{key_id}/release (escape hatch, audited).
# gateway_runaway_trips_total{key} counts trips; a `runaway.trip`
# observer event fires per trip. Raise the threshold if you run
# legitimate identical-request fan-out (benchmarks) through the
# gateway.
runaway:
  enabled: true
  identical_request_threshold: 10   # identical requests inside the window = a stuck loop
  identical_request_window_seconds: 60
  cooldown_seconds: 30              # first offense; repeats escalate
  cooldown_multiplier: 2.0          # 30s -> 60s -> 120s ...
  cooldown_max_seconds: 3600        # 1h ceiling
  reset_after_seconds: 600         # quiet period that clears the offense count

# Concurrency admission control + QoS: how many requests a key (and
# its tenant) may hold IN-FLIGHT against the upstream at once — RPM/TPM
# bound the rate, this bounds the parallelism (protects a provider
# quota or a small deployment fleet). Caps live on the rows, snapshotted
# at auth time: max_concurrency on a virtual key (POST/PATCH /admin/keys,
# admin UI key dialog) and the pooled max_concurrency on a tenant
# (POST/PATCH /admin/tenants) — a member key must pass both; the tenant
# can only narrow. Callers with neither cap skip admission entirely.
# The slot wraps the upstream call: cache hits and idempotent replays
# never hold one; a streamed response holds it until its body completes
# (a slow reader occupies upstream capacity for exactly as long as it
# reads). When every slot is taken, requests QUEUE (no extra upstream
# pressure) admitted highest-priority-first — a key's `priority`
# (POST/PATCH /admin/keys; default 0, higher first, FIFO within a
# priority) is the QoS knob, and a waiter on a different key never
# blocks behind an unrelated saturated one. A queue wait past
# wait_seconds answers 429 rate_limit_exceeded + Retry-After
# (0 = fail fast when all slots are taken). Chat-family surfaces only
# (embeddings/images/audio bypass — documented honestly). Admin view:
# GET /admin/concurrency (in-flight/queued per key+tenant, live config
# echo). Metrics: gateway_concurrency_inflight{key} /
# gateway_concurrency_queued{key} gauges,
# gateway_concurrency_rejected_total{key}; a `concurrency.timeout`
# observer event fires per refused wait. State is in-process (like the
# idempotency in-flight map): a multi-replica fleet enforces its
# per-replica share — run N replicas with cap/N, or accept the
# approximation.
concurrency:
  enabled: true
  wait_seconds: 10        # queue wait before 429; 0 = fail fast

# Lifecycle events: subscribe handlers to the request-stage boundaries
# (request.received / request.routed / response.completed / stream.* /
# auth.rejected / key.* / budget.threshold / batch.* ...). Two kinds:
# observer (fire-and-forget, background queue — cannot affect the
# request) and interceptor (in-band, may abort by raising GatewayError;
# only request.received and response.completed, listed explicitly).
# With no handlers, emission is a no-op. Hot-reloadable.
events:
  enabled: true
  queue_size: 10000
  handlers: []
  #  - class_path: "my_pkg.events:SlackNotifier"  # pkg.module:ClassName
  #    kind: observer                             # observer | interceptor
  #    events: ["request.*", "batch.completed"]   # names or patterns; null = all
  #    params: {webhook_url: "https://hooks.slack.com/..."}

# Per-1M-token pricing overrides (USD). Merged over built-in defaults;
# longest model-prefix match wins. Embeddings are input-only.
#
# Non-token modalities use unit-price keys in the same block:
#   image_usd               — per generated image (/v1/images/generations)
#   audio_usd_per_minute    — per minute of audio, billed from the duration
#                             the provider reports (verbose_json responses;
#                             use that response_format when billing matters)
#   speech_usd_per_1m_chars — per 1M input characters (/v1/audio/speech)
pricing: {}
  # gpt-4o: {input: 2.5, output: 10.0}
  #   cached_input: 1.25   # per-1M price for provider-side prompt-cache
  #                       # reads (OpenAI prompt_tokens_details.cached_
  #                       # tokens). Defaults to 50% of `input` when
  #                       # omitted; set it explicitly when the
  #                       # provider's discount differs (Anthropic's
  #                       # cache reads are 10% of base input).
  # text-embedding-3-small: {input: 0.02}
  # gpt-image-1: {image_usd: 0.04}
  # whisper-1: {audio_usd_per_minute: 0.006}
  # tts-1: {speech_usd_per_1m_chars: 15.0}
