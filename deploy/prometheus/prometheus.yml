# Prometheus scrapes the gateway's own /metrics endpoint — the primary,
# full-fidelity metrics path (histograms included). The gateway's OTel
# metrics bridge is only for OTLP-native backends and is off in this stack.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
