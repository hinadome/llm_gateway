# CI: the full test suite on every push and pull request.
#
# The suite is self-contained (httpx MockTransport, fakeredis, tmp-path
# SQLite databases) — no network access or external services needed.
# The workflow stays dormant until the repository is pushed to GitHub.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q

      - name: Smoke-check the shipped config
        run: uv run python -c "from gateway.config import GatewayConfig; GatewayConfig.load('config.yaml')"
